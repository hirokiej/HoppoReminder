inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest
  - rubocop-capybara

AllCops:
  NewCops: enable
  Exclude:
    - 'db/schema.rb'
    - 'bin/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

# 行長は基本160文字まで
Layout/LineLength:
  Max: 160

# 文字列はシングルクォート
Style/StringLiterals:
  EnforcedStyle: single_quotes

# メソッド長は長くても許容（必要になったら調整）
Metrics/MethodLength:
  Max: 25
